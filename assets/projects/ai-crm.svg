<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-labelledby="t"><title id="t">AI-CRM agent pipeline: score, route, draft and explain nodes feed a human approval gate.</title><defs><linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1124"/><stop offset=".55" stop-color="#060A14"/><stop offset="1" stop-color="#0B0F24"/></linearGradient><radialGradient id="cgb"><stop offset="0" stop-color="#36BCF7" stop-opacity=".22"/><stop offset="1" stop-color="#36BCF7" stop-opacity="0"/></radialGradient><radialGradient id="cgv"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".22"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><linearGradient id="cedge" x1="0" x2="1"><stop offset="0" stop-color="#36BCF7" stop-opacity="0"/><stop offset=".5" stop-color="#36BCF7" stop-opacity=".55"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient><clipPath id="cclip"><rect width="440" height="160" rx="14"/></clipPath><pattern id="cgrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity=".07"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#4A6196"/></marker><radialGradient id="pg"><stop offset="0" stop-color="#7DD3FC" stop-opacity=".7"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#cclip)"><rect width="440" height="160" fill="url(#cbg)"/><ellipse cx="40" cy="0" rx="200" ry="110" fill="url(#cgb)"/><ellipse cx="430" cy="170" rx="220" ry="120" fill="url(#cgv)"/><rect width="440" height="160" fill="url(#cgrid)" opacity=".8"/><text x="20" y="28" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1.6" fill="#36BCF7">H