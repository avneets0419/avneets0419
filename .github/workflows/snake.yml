# Regenerates the contribution-graph snake shown in README.md and publishes it
# to the `output` branch, which the README loads from raw.githubusercontent.com.
# Setup and troubleshooting: see docs/MAINTAINING.md.
name: Contribution snake

on:
  schedule:
    - cron: "23 2 * * *" # daily at 02:23 UTC (off the top of the hour to avoid queue spikes)
  workflow_dispatch:

permissions:
  contents: write # needed only to push the generated SVGs to the output branch

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#0C3354,#11609E,#2490DC,#36BCF7
            dist/snake-light.svg?palette=github-light&color_snake=#7C3AED&color_dots=#EBEDF0,#BFE3FB,#7CC4F2,#2F95DB,#1767A8

      - name: Publish to the output branch when the SVGs changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$remote" output >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch output "$remote" out
          else
            git init --quiet --initial-branch=output out
            git -C out remote add origin "$remote"
          fi

          cp dist/snake-dark.svg dist/snake-light.svg out/
          cd out
          git add snake-dark.svg snake-light.svg
          if git diff --cached --quiet; then
            echo "Snake SVGs unchanged; skipping commit."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "chore: update contribution snake"
          git push --quiet origin output
